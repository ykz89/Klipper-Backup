[gcode_macro NEVERMORE_START]
gcode:
    # Override to 20% — suppresses the default 100% that NEVERMORE_PRINT_START would set
    NEVERMORE_PRINT_START FAN_SPEED=0.20

[gcode_macro NEVERMORE_END]
gcode:
    # Return to automatic mode first (disables print-mode override)
    NEVERMORE_PRINT_END
    # Wait 10 minutes, then blast at 100% for 20 minutes
    UPDATE_DELAYED_GCODE ID=_nevermore_postprint_blast DURATION=600

[delayed_gcode _nevermore_postprint_blast]
gcode:
    # Override fan to 100% for the purge cycle
    SET_FAN_SPEED FAN=nevermore_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=_nevermore_postprint_stop DURATION=1200

[delayed_gcode _nevermore_postprint_stop]
gcode:
    # Clear override — return to automatic (quiet) mode
    SET_FAN_SPEED FAN=nevermore_fan SPEED=0
    NEVERMORE_PRINT_END