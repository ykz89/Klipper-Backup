[gcode_macro NEVERMORE_START]
description: Start Nevermore at 20% for heating and printing
gcode:
    SET_FAN_SPEED FAN=nevermore_fan SPEED=0.20

[gcode_macro NEVERMORE_END]
description: Post-print: wait 10 min, then run 100% for 20 min, then stop
gcode:
    UPDATE_DELAYED_GCODE ID=_nevermore_postprint_blast DURATION=600

[delayed_gcode _nevermore_postprint_blast]
gcode:
    SET_FAN_SPEED FAN=nevermore_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=_nevermore_postprint_stop DURATION=1200

[delayed_gcode _nevermore_postprint_stop]
gcode:
    SET_FAN_SPEED FAN=nevermore_fan SPEED=0